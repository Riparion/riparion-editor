[package]
name = "riparion-editor"
version = "0.1.0"
edition = "2021"
description = "A block-swap live-preview editor for Dioxus: a document renders as styled blocks and the active block swaps to a raw textarea. Bring your own renderer (Markdown by default); drag-to-reorder."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tonybierman/riparion-cms"
readme = "README.md"

[features]
default = []
# Web build: pulls the `web-sys` bindings used to read the textarea caret
# (selectionStart) so double-Enter can split a block at the cursor, and turns on
# riparion-dnd's web drag mechanics. On non-web builds these compile out.
web = ["dioxus/web", "dep:dioxus-web", "dep:web-sys", "dep:wasm-bindgen", "riparion-dnd/web"]

[dependencies]
# No platform features here (the consuming app turns on `dioxus/web` etc.; Cargo
# unifies them), and no markdown/sanitizer deps — the app injects a
# `render_block` callback so this crate never pins a markdown dialect.
dioxus = "0.7.9"

# Drag-and-drop block reordering. Riparion's own HTML5 native-drag primitives;
# Cargo.lock pins the exact commit (bump with `cargo update -p riparion-dnd`). Its
# web-sys drag mechanics are behind `riparion-dnd/web`, enabled by our `web` feature.
riparion-dnd = { git = "https://github.com/Riparion/riparion-dnd", package = "riparion-dnd" }

# Web-only: reading the textarea caret needs wasm-bindgen / web-sys. All gated
# behind the `web` feature so server/desktop builds stay clean.
dioxus-web = { version = "0.7.9", default-features = false, optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dependencies.web-sys]
version = "0.3"
optional = true
features = [
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "HtmlTextAreaElement",
    # `Element` is the mounted-event web type we cast to a textarea to place the
    # caret when arrow-navigating into an adjacent block.
    "Element",
    # `InputEvent` lets `oninput` read the `inputType` (insertLineBreak / …) so a
    # touch-keyboard Enter — which never arrives as a `Key::Enter` keydown — can
    # still split a block at the cursor.
    "InputEvent",
]

[dev-dependencies]
# Only the `markdown` example needs a concrete renderer; the crate itself pins
# no markdown dialect.
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# The example's menubar / alert-dialog widgets (installed with `dx components
# add --module-path examples/markdown/components menubar alert_dialog`) wrap
# these primitives. Dev-only: the library itself ships no widgets.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }

# The runnable demo. Gated on `web` (it calls `dioxus::launch`, which needs a
# renderer) so the default host build — and `cargo clippy --all-targets` — skips
# it. Run with: `dx serve --example markdown --features web`.
[[example]]
name = "markdown"
required-features = ["web"]
