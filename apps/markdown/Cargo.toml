[package]
name = "riparion-mdedit"
version = "0.1.0"
edition = "2021"
description = "A runnable Markdown editor app built on riparion-editor: pulldown-cmark renders each block, the active block swaps to a raw textarea, with frontmatter as a Properties card and File/Open/Save via the File System Access API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tonybierman/riparion-cms"
readme = "README.md"

[features]
# Web is the only target this app runs on (it calls `dioxus::launch`, which
# needs a renderer), so it's on by default — `dx serve` and `cargo clippy
# --target wasm32-unknown-unknown` work with no extra flags. The library's own
# web-sys caret/drag mechanics ride along via `riparion-editor/web`.
default = ["web"]
web = ["dioxus/web", "riparion-editor/web"]

[dependencies]
# The block editor this app demos. Path dep on the workspace root; the app
# injects a `render_block` callback so the dialect (Markdown, below) lives here,
# not in the library.
riparion-editor = { path = "../.." }

# No platform features here — the `web` feature forwards `dioxus/web`. Cargo
# unifies features across the graph.
dioxus = "0.7.9"

# The concrete Markdown renderer plugged into riparion-editor's `render_block`
# callback. The library pins no markdown dialect; this app does.
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

# The menubar / alert-dialog / context-menu / switch widgets (installed with
# `dx components add --module-path src/components …`) wrap these primitives.
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
